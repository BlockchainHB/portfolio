<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 608px; height: 500px; overflow: hidden; }
  body { font-family: "SF Pro", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body.light { background: linear-gradient(160deg, #EDF2FF 0%, #D2DDFC 100%); }
  body.dark { background: linear-gradient(160deg, #18244A 0%, #0B1024 100%); }
  .mono { font-family: Menlo, monospace; }
  #world { position: absolute; left: 47px; top: 44px; width: 1512px; height: 982px; transform-origin: 0 0; transform: scale(0.34); }
  .strip { position: absolute; left: 0; top: 0; width: 1512px; height: 982px; }
  #ghost { opacity: 0.45; } .dark #ghost { opacity: 0.6; }
  #display { position: absolute; left: 0; top: 0; width: 1512px; height: 982px; border-radius: 18px; overflow: hidden; }
  .light #display { box-shadow: 0 0 0 10px #16181D, 0 0 0 11px #3A3D45, 0 30px 80px rgba(16,20,31,0.28);
    background: radial-gradient(120% 90% at 85% 8%, #86A6FF 0%, rgba(134,166,255,0) 55%), radial-gradient(90% 80% at 8% 100%, #102A9C 0%, rgba(16,42,156,0) 62%), linear-gradient(160deg, #3F6CFA 0%, #2856ED 48%, #1C3FCB 100%); }
  .dark #display { box-shadow: 0 0 0 10px #050608, 0 0 0 11px #2A2D35, 0 30px 80px rgba(0,0,0,0.5);
    background: radial-gradient(120% 90% at 85% 8%, #3557D6 0%, rgba(53,87,214,0) 55%), radial-gradient(90% 80% at 8% 100%, #060E3A 0%, rgba(6,14,58,0) 62%), linear-gradient(160deg, #1B3AAE 0%, #142B86 48%, #0B1A5C 100%); }

  /* Windows: live HTML so content reflows as Ribbon resizes them. */
  .win { position: absolute; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; background: var(--win); color: var(--text); }
  .light .win { box-shadow: 0 0 0 0.5px rgba(0,0,0,0.2), 0 10px 30px rgba(10,20,60,0.18); }
  .dark .win { box-shadow: 0 0 0 0.5px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.45); }
  .light .win.focused { box-shadow: 0 0 0 0.5px rgba(0,0,0,0.22), 0 18px 50px rgba(10,20,60,0.32), 0 4px 12px rgba(10,20,60,0.12); }
  .dark .win.focused { box-shadow: 0 0 0 0.5px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1), 0 18px 50px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.3); }
  .lights { display: flex; gap: 8px; flex-shrink: 0; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--lightsOff); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
  .focused .lights i:nth-child(1) { background: #FF5F57; }
  .focused .lights i:nth-child(2) { background: #FEBC2E; }
  .focused .lights i:nth-child(3) { background: #28C840; }
  .bar { flex-shrink: 0; display: flex; align-items: center; }
  .nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Codex */
  .codex .bar { height: 52px; gap: 14px; padding: 0 16px 0 18px; border-bottom: 1px solid var(--line2); }
  .codex .title { flex: 1; font-size: 13px; line-height: 16px; font-weight: 600; }
  .codex .thread { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 22px 22px 0; width: 100%; max-width: 760px; align-self: center; font-size: 14px; line-height: 21px; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--text3); font-size: 13px; line-height: 16px; }
  .chip { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--text2); font-size: 11px; line-height: 16px; }
  .bubble { align-self: flex-end; max-width: 380px; padding: 10px 14px; border-radius: 18px; background: var(--chip); }
  .step { display: flex; align-items: center; gap: 8px; color: var(--text3); font-size: 13px; line-height: 18px; white-space: nowrap; }
  .step .mono { font-size: 12px; color: var(--text2); }
  .diff { border: 1px solid var(--card); border-radius: 12px; overflow: hidden; font-size: 13px; line-height: 18px; }
  .diff div { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: var(--text2); white-space: nowrap; }
  .diff div + div { border-top: 1px solid var(--line2); }
  .diff .grow { flex: 1; }
  .add { color: var(--plus); font-weight: 700; font-size: 12px; } .rem { color: var(--minus); font-weight: 700; font-size: 12px; }
  .composer { flex-shrink: 0; padding: 0 16px 16px; width: 100%; max-width: 760px; align-self: center; }
  .composer > div { display: flex; flex-direction: column; gap: 14px; padding: 14px 14px 10px 16px; border: 1px solid var(--composerLine); border-radius: 22px; background: var(--composer); }
  .ph { font-size: 14px; line-height: 20px; color: var(--ph); }
  .crow { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text3); }
  .send { width: 28px; height: 28px; border-radius: 50%; background: var(--sendBg); display: flex; align-items: center; justify-content: center; margin-left: auto; }

  /* Cursor */
  .cursor .bar { height: 40px; padding: 0 14px 0 18px; background: var(--chrome); border-bottom: 1px solid var(--line); }
  .search { width: 360px; max-width: 46%; height: 26px; border-radius: 7px; background: var(--field); color: var(--mute); font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto; }
  .ide { flex: 1; min-height: 0; display: flex; }
  .explorer { width: 236px; flex-shrink: 0; background: var(--chrome); border-right: 1px solid var(--line); padding: 10px 0; font-size: 13px; line-height: 22px; color: var(--text2); white-space: nowrap; overflow: hidden; }
  .explorer .label { padding: 0 16px 6px; font-size: 11px; line-height: 18px; font-weight: 600; letter-spacing: 0.06em; color: var(--mute); display: block; }
  .row { display: flex; align-items: center; gap: 6px; }
  .row.sel { background: var(--sel); color: var(--selText); }
  .row .m { margin-left: auto; padding-right: 14px; font-size: 11px; color: #C9A227; }
  .dot { width: 8px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .editor { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--editor); }
  .tabs { height: 36px; flex-shrink: 0; display: flex; background: var(--chrome); border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 0 14px; border-right: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .tab.on { background: var(--editor); color: var(--text); box-shadow: inset 0 2px 0 #2856ED; }
  .crumb { height: 24px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 16px; color: var(--mute); font-size: 12px; white-space: nowrap; }
  .code { flex: 1; min-height: 0; overflow: hidden; padding: 6px 0; font-family: Menlo, monospace; font-size: 12px; line-height: 20px; white-space: pre; color: var(--cPlain); }
  .code > div { height: 20px; display: flex; }
  .code .n { width: 56px; flex-shrink: 0; padding-right: 22px; text-align: right; color: var(--cNum); }
  .code .plus { background: var(--addBg); box-shadow: inset 3px 0 0 var(--addBar); }
  .k { color: var(--cKw); } .t { color: var(--cTag); } .s { color: var(--cStr); } .d { color: var(--mute); }
  .status { height: 24px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--chrome); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; }

  /* Safari */
  .safari .bar { height: 52px; gap: 16px; padding: 0 16px 0 18px; background: var(--chrome); border-bottom: 1px solid var(--line); }
  .addr { flex: 1; display: flex; justify-content: center; min-width: 0; }
  .addr > div { width: 340px; max-width: 100%; height: 30px; border-radius: 9px; background: var(--field); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--text2); }
  .page { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--page); }
  .site-nav { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 32px; border-bottom: 1px solid var(--line2); font-size: 13px; color: var(--navText); white-space: nowrap; }
  .site-nav .brand { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: var(--siteText); margin-right: auto; }
  .btn { padding: 7px 14px; border-radius: 8px; background: #2856ED; color: #fff; font-weight: 600; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 64px 40px 0; text-align: center; }
  .hero h1 { font-size: 52px; line-height: 54px; font-weight: 500; letter-spacing: -0.04em; color: var(--siteText); }
  .hero p { font-size: 16px; line-height: 24px; color: var(--siteMuted); }
  .hero .acts { display: flex; align-items: center; gap: 18px; padding-top: 8px; font-size: 15px; white-space: nowrap; }
  .hero .acts .btn { padding: 11px 20px; border-radius: 10px; }
  .scene { flex: 1; display: flex; gap: 10px; padding: 40px 32px 0; }
  .scene i { flex: 1; border: 1px solid var(--boxLine); border-radius: 10px; background: var(--box); }
  .scene i:nth-child(2) { flex: 1.9; }

  /* Claude */
  .claude { background: var(--cBg); }
  .claude .bar { height: 44px; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--cLine); }
  .claude .title { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--cText); }
  .cthread { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 40px 48px 0; width: 100%; max-width: 680px; align-self: center; }
  .cbubble { align-self: flex-end; max-width: 420px; padding: 12px 16px; border-radius: 16px; background: var(--cBubble); font-size: 15px; line-height: 22px; color: var(--cText); }
  .creply { display: flex; gap: 12px; font-size: 15px; line-height: 24px; color: var(--cText); }
  .ccomp { padding: 0 48px 24px; width: 100%; max-width: 680px; align-self: center; }
  .ccomp > div { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 14px 18px; border-radius: 20px; background: var(--cComp); box-shadow: 0 0 0 1px var(--cRing); font-size: 15px; color: var(--cPh); white-space: nowrap; }

  /* Terminal */
  .term { background: var(--termBg); }
  .term .bar { height: 30px; gap: 14px; padding: 0 12px; background: var(--termBar); border-bottom: 1px solid var(--line); }
  .term .title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: var(--text3); white-space: nowrap; overflow: hidden; }
  .term pre { padding: 8px 10px; font-family: Menlo, monospace; font-size: 12px; line-height: 17px; color: var(--text); }

  /* Menu bar */
  #menubar { position: absolute; left: 0; top: 0; width: 1512px; height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; color: #fff; font-size: 13px; line-height: 16px; font-weight: 500; z-index: 5; }
  #menubar .menus { display: flex; align-items: center; gap: 22px; }
  #menubar .status-items { display: flex; align-items: center; gap: 18px; }
  #app { font-weight: 700; }

  /* Overview, context menu, pointer, pair outline */
  #panel { position: absolute; left: 444px; top: 417px; width: 624px; height: 172px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; z-index: 6; opacity: 0; }
  .light #panel { background: rgba(246,246,248,0.93); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 24px 70px rgba(10,20,60,0.32), 0 6px 18px rgba(10,20,60,0.14); }
  .dark #panel { background: rgba(44,44,48,0.94); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1), 0 24px 70px rgba(0,0,0,0.5); }
  .tile { width: 112px; height: 132px; flex-shrink: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px; line-height: 18px; font-weight: 500; color: var(--text); }
  .tile .icon { width: 80px; height: 80px; position: relative; }
  .tile .icon img { width: 80px; height: 80px; }
  .badge { position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .light .badge { background: rgba(246,246,248,0.95); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12); }
  .dark .badge { background: rgba(50,50,54,0.95); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.15); }
  .menu { position: absolute; z-index: 8; width: 200px; padding: 5px; border-radius: 10px; font-size: 13px; line-height: 16px; opacity: 0; }
  .light .menu { background: rgba(246,246,248,0.97); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.18), 0 10px 30px rgba(0,0,0,0.2); color: #1D1D1F; }
  .dark .menu { background: rgba(40,40,44,0.97); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.45); color: #F2F2F7; }
  .menu .it { height: 24px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
  .menu .it.off { opacity: 0.4; }
  .menu .it.hl { background: #0A7AFF; color: #fff; opacity: 1; }
  .menu hr { border: 0; height: 1px; margin: 4px 10px; }
  .light .menu hr { background: rgba(0,0,0,0.1); } .dark .menu hr { background: rgba(255,255,255,0.12); }
  #pointer { position: absolute; z-index: 9; width: 26px; height: 38px; transform-origin: 3px 2px; opacity: 0; }
  #outline { position: absolute; z-index: 4; border-radius: 14px; border: 6px solid var(--outline); box-shadow: 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 0 1px rgba(255,255,255,0.5); opacity: 0; pointer-events: none; }

  /* Caption */
  #caption { position: absolute; left: 0; right: 0; top: 432px; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 14px; line-height: 20px; }
  .light #caption { color: #5D5D5D; } .dark #caption { color: #A1A1A1; }
  .keys { display: flex; gap: 4px; }
  .key { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }
  .light .key { background: #fff; color: #292929; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 1px 0 1px rgba(0,0,0,0.06); }
  .dark .key { background: #222; color: #EDEDED; box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 1px 0 1px rgba(0,0,0,0.5); }
  .light .key.down { background: #E6ECFD; color: #1C3FB8; box-shadow: 0 0 0 1px rgba(40,86,237,0.35); }
  .dark .key.down { background: #24315C; color: #C9D6FF; box-shadow: 0 0 0 1px rgba(127,160,255,0.45); }

  .light { --win:#FFFFFF; --chrome:#F7F7F8; --line:#E6E6E9; --line2:#EFEFF1; --text:#1D1D1F; --text2:#3A3A3C; --text3:#6E6E73; --mute:#8A8A8E; --ph:#A1A1A6; --chip:#F2F2F4; --card:#E8E8EB; --composer:#FFFFFF; --composerLine:#E5E5EA; --field:#ECECEF; --sel:#E3E9FB; --selText:#1C3FB8; --editor:#FFFFFF; --addBg:#E7F5EC; --addBar:#2EA36B; --cPlain:#3B414B; --cNum:#B4B9C2; --cKw:#8A4FD8; --cTag:#2856ED; --cStr:#1F8A5B; --plus:#1F8A5B; --minus:#C2413B; --page:#FFFFFF; --siteText:#000000; --siteMuted:#5D6470; --navText:#20242C; --box:#FFFFFF; --boxLine:#DCDDE2; --cBg:#FAF9F5; --cBubble:#F0EEE6; --cLine:#ECEAE3; --cText:#3D3929; --cPh:#A09C8E; --cComp:#FFFFFF; --cRing:#E8E6DD; --termBg:#FFFFFF; --termBar:#F2F2F4; --lightsOff:#DDDDE0; --sendBg:#1D1D1F; --sendFg:#FFFFFF; --outline:#2856ED; }
  .dark { --win:#1E1E21; --chrome:#232326; --line:#333338; --line2:#333338; --text:#F2F2F7; --text2:#D1D1D6; --text3:#A1A1A6; --mute:#8E8E93; --ph:#6E6E73; --chip:#2E2E32; --card:#38383D; --composer:#262629; --composerLine:#3A3A3F; --field:#333337; --sel:#24315C; --selText:#9DB4FF; --editor:#1A1A1D; --addBg:#132A1C; --addBar:#3FB873; --cPlain:#D4D7DD; --cNum:#5C6370; --cKw:#C59BFF; --cTag:#7FA0FF; --cStr:#7FD3A0; --plus:#7FD3A0; --minus:#FF7A70; --page:#10141F; --siteText:#FFFFFF; --siteMuted:#A0A6B1; --navText:#E6E8EC; --box:#1A2030; --boxLine:#2B3242; --cBg:#262624; --cBubble:#393937; --cLine:#3A3A37; --cText:#E8E6DC; --cPh:#8A877C; --cComp:#30302E; --cRing:#45443F; --termBg:#1E1E21; --termBar:#2A2A2D; --lightsOff:#4A4A4F; --sendBg:#F2F2F7; --sendFg:#1D1D1F; --outline:#7FA0FF; }
</style>
</head>
<body>
  <div id="world">
    <div id="ghost" class="strip"></div>
    <div id="display">
      <div id="strip" class="strip"></div>
      <div id="outline"></div>
      <div id="menubar">
        <div class="menus">
          <svg width="14" height="17" viewBox="0 0 24 24"><path fill="#fff" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
          <span id="app">Codex</span><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
        </div>
        <div class="status-items">
          <img src="layers/menu-white.png" style="width:16px;height:16px" />
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity="0.5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity="0.5"/></svg>
          <svg width="17" height="13" viewBox="0 0 17 13"><path d="M8.5 2.6c2.4 0 4.6.9 6.3 2.5l1.2-1.3C14 1.9 11.4.8 8.5.8S3 1.9 1 3.8l1.2 1.3C3.9 3.5 6.1 2.6 8.5 2.6z" fill="#fff"/><path d="M8.5 6.1c1.4 0 2.7.5 3.8 1.4l1.2-1.3C12.1 5 10.4 4.3 8.5 4.3S4.9 5 3.5 6.2l1.2 1.3c1.1-.9 2.4-1.4 3.8-1.4z" fill="#fff"/><path d="M8.5 9.6c.5 0 1 .2 1.4.5l1.3-1.3C10.5 8.1 9.5 7.8 8.5 7.8s-2 .3-2.7 1l1.3 1.3c.4-.3.9-.5 1.4-.5z" fill="#fff"/><circle cx="8.5" cy="11.6" r="1.2" fill="#fff"/></svg>
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.75" y="0.75" width="14.5" height="5" rx="2.5" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="12.5" cy="3.25" r="1.6" fill="#fff"/><rect x="0.75" y="8.25" width="14.5" height="5" rx="2.5" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="3.5" cy="10.75" r="1.6" fill="#fff"/></svg>
          <span style="white-space:pre">Wed Oct 21  9:41 AM</span>
        </div>
      </div>
      <div id="panel"></div>
      <div id="menu" class="menu"></div>
      <div id="submenu" class="menu"></div>
      <svg id="pointer" viewBox="0 0 26 38"><path d="M3 2v29l7-7 5 11 5-2-5-11h10z" fill="#000" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="caption"><div class="keys" id="keys"></div><span id="label"></span></div>

<script>
const q = new URLSearchParams(location.search);
const THEME = q.get('theme') || 'light';
const SCENE = q.get('scene') || 'scroll';
document.body.className = THEME;

// ---------- windows ----------
const LIGHTS = '<div class="lights"><i></i><i></i><i></i></div>';
const ICON = (d, c = 'var(--mute)') => `<svg width="14" height="14" viewBox="0 0 16 16"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const FILE = ICON('M4 1.75h5l3 3v9.5H4z');

// ---------- easing and tracks ----------
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;

const TRAVEL = bezier(0.77, 0, 0.175, 1);     // the website's window moves
const FEEDBACK = bezier(0.23, 1, 0.32, 1);    // panels, menus, highlights
// Sequential moves: [{t, d, v, e}] from a base value.
function anim(t, base, moves) {
  let v = base;

    v = t >= m.t + m.d ? m.v : from + (m.v - from) * (m.e || TRAVEL)((t - m.t) / m.d);

}

function layout(widths, startX = 6) {

  for (const id of ['Codex', 'Cursor', 'Safari', 'Terminal']) { out[id] = x; x += widths[id] + GAP; }
  out.Claude = startX - GAP - widths.Claude;

}

    for (const r of rounds) if (t > r.click - 0.35 && t < r.click + 0.08) s.hover = r.to;
    s.keys = ['⌃', '⌥', 'Tab']; s.label = 'Arrange windows';
    s.down = rounds.some(r => t >= r.open - 0.05 && t < r.open + 0.2);
    return s;
  } },
};

// ---------- draw ----------
const $ = id => document.getElementById(id);
function menuHTML(m) {
  const items = [['Pair with Left', true], ['Pair with Right', m.paired], ['Ungroup', !m.paired]];
  let h = items.map(([label, off], i) => `<div class="it${off ? ' off' : ''}${m.hover === i ? ' hl' : ''}">${label}</div>`).join('');
  h += `<hr><div class="it${m.hover === 3 ? ' hl' : ''}">Arrange<span>›</span></div>`;
  return h;
}
function draw(s) {
  for (const layer of ['strip', 'ghost']) {
    for (const id of ORDER) {
      const w = s.wins[id], el = EL[layer][id];
      el.style.left = w.x + 'px'; el.style.top = w.y + 'px'; el.style.width = w.w + 'px'; el.style.height = w.h + 'px';
      el.classList.toggle('focused', id === s.focus);
    }
    $(layer).style.transform = `translateX(${-s.offset}px)`;
  }
  $('app').textContent = s.focus;
  // Overview
  panel.style.opacity = s.panel; panel.style.transform = `scale(${0.96 + 0.04 * s.panel})`;
  const tint = THEME === 'dark' ? '255,255,255' : '0,0,0';
  for (const id of ORDER) {
    const sel = id === s.selected, hv = id === s.hover;
    TILE[id].style.background = sel ? `rgba(${tint},${THEME === 'dark' ? 0.12 : 0.08})` : hv ? `rgba(${tint},${THEME === 'dark' ? 0.07 : 0.045})` : 'transparent';
    TILE[id].style.transform = hv && s.press ? 'scale(0.96)' : 'none';
    TILE[id].querySelector('.badge').style.opacity = id === 'Codex' || id === 'Cursor' ? s.badges : 0;
  }
  // Context menu and submenu
  const menu = $('menu'), subm = $('submenu');
  if (s.menu) {
    menu.style.opacity = s.menu.o; menu.style.left = s.menu.x + 'px'; menu.style.top = s.menu.y + 'px';
    menu.innerHTML = menuHTML(s.menu);
    if (s.menu.sub) {
      subm.style.opacity = s.menu.sub.o; subm.style.left = s.menu.x + 196 + 'px'; subm.style.top = s.menu.y + 24 * 3 + 9 + 'px';
      subm.innerHTML = ['½–½', '⅓–⅔', '⅔–⅓'].map((l, i) => `<div class="it${s.menu.sub.hover === i ? ' hl' : ''}">${l}</div>`).join('');
    } else subm.style.opacity = 0;
  } else { menu.style.opacity = 0; subm.style.opacity = 0; }
  // Pointer
  const pe = $('pointer');
  if (s.pointer) {
    pe.style.opacity = s.pointer.o; pe.style.left = s.pointer.x + 'px'; pe.style.top = s.pointer.y + 'px';
    pe.style.transform = `scale(${s.pointer.press ? 1.35 : 1.5})`;
  } else pe.style.opacity = 0;
  // Pair outline around Codex and Cursor, in screen coordinates.
  const o = $('outline');
  o.style.opacity = s.outline;
  const a = s.wins.Codex, b = s.wins.Cursor;
  o.style.left = a.x - s.offset + 3 + 'px'; o.style.top = TOP + 3 + 'px';
  o.style.width = b.x + b.w - a.x - 6 + 'px'; o.style.height = FULL - 6 + 'px';
  // Caption
  $('keys').innerHTML = s.keys.map(k => `<span class="key${s.down ? ' down' : ''}">${k}</span>`).join('');
  $('label').textContent = s.label;
}

const scene = SCENES[SCENE];
window.DURATION = scene.duration;
window.render = t => draw(scene.render(t));
window.render(0);
</script>
</body>
</html>
